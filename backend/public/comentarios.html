<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comentarios de prueba — TallerOS</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#f3f5f8;margin:0;padding:20px;color:#1a1a1a}
  .card{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h1{color:#16406b;font-size:22px;margin:0 0 6px}
  p.sub{color:#555;margin:0 0 18px;line-height:1.5;font-size:14px}
  label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
  input,select,textarea{width:100%;padding:11px;border:1px solid #cfd5dc;border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
  textarea{min-height:130px;resize:vertical}
  button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#f5b800;color:#16191d;font-weight:800;font-size:16px;cursor:pointer}
  button:disabled{opacity:.6}
  .ok{display:none;text-align:center;padding:20px 0}
  .ok h2{color:#1a7f37}
  .err{color:#b42318;font-size:14px;margin-top:12px;display:none}
  .opc{font-weight:400;color:#888}
  .trampa{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="card">
  <div id="form">
    <h1>🔧 TallerOS — Tu opinión</h1>
    <p class="sub">Gracias por probar la app. Cuéntanos qué fallas ves o qué te gustaría mejorar. Solo toma un minuto.</p>
    <label>¿Qué tipo de comentario es?</label>
    <select id="tipo">
      <option value="Falla">Algo no funciona (falla)</option>
      <option value="Sugerencia">Una idea o sugerencia</option>
      <option value="Diseño">Algo que no se entiende o se ve mal</option>
      <option value="Otro">Otro</option>
    </select>
    <label>¿Con qué rol probaste?</label>
    <select id="rol">
      <option value="Cliente">Cliente</option>
      <option value="Mecánico">Mecánico</option>
      <option value="Administrador">Administrador</option>
    </select>
    <label>Tu comentario</label>
    <textarea id="mensaje" maxlength="3000" placeholder="Cuéntanos qué hacías y qué pasó…"></textarea>
    <label>Tu teléfono / marca de celular <span class="opc">(opcional)</span></label>
    <input id="dispositivo" maxlength="120" placeholder="Ej. Samsung A14">
    <label>Tu nombre <span class="opc">(opcional)</span></label>
    <input id="nombre" maxlength="100" placeholder="Tu nombre">
    <label>Tu correo o WhatsApp <span class="opc">(opcional, por si necesitamos preguntarte algo)</span></label>
    <input id="contacto" maxlength="150" placeholder="correo@gmail.com">
    <input class="trampa" id="web" tabindex="-1" autocomplete="off">
    <div class="err" id="err"></div>
    <button id="btn" onclick="enviar()">Enviar comentario</button>
  </div>
  <div class="ok" id="ok">
    <h2>✅ ¡Gracias!</h2>
    <p>Recibimos tu comentario. Nos ayuda mucho a mejorar TallerOS.</p>
    <button onclick="otro()">Enviar otro comentario</button>
  </div>
</div>
<script>
function $(i){return document.getElementById(i)}
async function enviar(){
  var err=$('err'); err.style.display='none';
  var mensaje=$('mensaje').value.trim();
  if(mensaje.length<3){err.textContent='Escribe tu comentario.';err.style.display='block';return}
  var btn=$('btn'); btn.disabled=true; btn.textContent='Enviando…';
  try{
    var r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      tipo:$('tipo').value,rol:$('rol').value,mensaje:mensaje,dispositivo:$('dispositivo').value,
      nombre:$('nombre').value,contacto:$('contacto').value,web:$('web').value})});
    var d=await r.json().catch(function(){return {}});
    if(!r.ok) throw new Error(d.error||'No se pudo enviar. Intenta de nuevo.');
    $('form').style.display='none'; $('ok').style.display='block';
  }catch(e){err.textContent=e.message;err.style.display='block'}
  btn.disabled=false; btn.textContent='Enviar comentario';
}
function otro(){ $('mensaje').value=''; $('ok').style.display='none'; $('form').style.display='block'; }
</script>
</body>
</html>
